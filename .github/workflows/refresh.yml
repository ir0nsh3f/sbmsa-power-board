name: Refresh results and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/refresh.yml']
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sbmsa-refresh-and-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main # Queued runs must retain the newest committed archive.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install -r requirements.txt
      - name: Test parser and data-retention behavior
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test advanced metrics and schedule helpers
        run: node --test tests/*.test.cjs
      - name: Check official results
        id: collect
        continue-on-error: true
        run: python scripts/update_results.py
      - name: Validate publishable payload
        run: |
          python -c "import json; d=json.load(open('site/data.json')); assert len(d['divisions']) == 8; assert d['last_checked']; assert d['last_successful_check']; assert d['data_updated']"
          python -c "import json,hashlib; from scripts.history import load_index,result_data,encoded,SEASON; i=load_index('site/history'); d=json.load(open('site/data.json')); assert i['captures']; assert i['captures'][-1]['result_sha256'] == hashlib.sha256(encoded({'season':SEASON,'divisions':result_data(d['divisions'])})).hexdigest()"
      - name: Build verified last public pregame result models
        run: python scripts/projection_publication.py summarize
      - name: Validate projection history and exact current-data agreement
        run: python scripts/projection_publication.py validate
      - name: Preserve last check and data in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/history/ site/projections/
          if ! git diff --cached --quiet; then
            git commit -m 'Update official results check'
            git push
          fi
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Observe exact public forecast captures after deployment
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/projection_publication.py observe
          git add site/projections/publication/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve observed public forecast receipts'
            git push
          fi
          # Receipts are committed after upload; become public in the next deployment.
      - name: Flag collector failure after publishing retained data
        if: steps.collect.outcome == 'failure'
        run: |
          printf '%s\n' 'Source check failed. Last good results and a warning were published.'
          exit 1
