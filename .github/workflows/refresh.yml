name: Refresh results and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/refresh.yml']
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sbmsa-refresh-and-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install -r requirements.txt
      - name: Test parser and data-retention behavior
        run: python -m unittest discover -s tests -v
      - name: Check official results
        id: collect
        continue-on-error: true
        run: python scripts/update_results.py
      - name: Validate publishable payload
        run: |
          python -c "import json; d=json.load(open('site/data.json')); assert len(d['divisions']) == 8; assert d['last_checked']; assert d['last_successful_check']; assert d['data_updated']"
      - name: Preserve last check and data in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official results check'
            git push
          fi
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Flag collector failure after publishing retained data
        if: steps.collect.outcome == 'failure'
        run: |
          printf '%s\n' 'Source check failed. Last good results and a warning were published.'
          exit 1
